name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: esencial
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # GoTrue no crea el schema "auth" — solo las tablas dentro de él,
      # asumiendo que ya existe. Hay que crearlo ANTES de arrancar GoTrue, por
      # eso no lo usamos como `services:` (arrancan todos en paralelo, sin
      # orden) y en cambio lo levantamos nosotros mismos después de este paso.
      - name: Crear el schema "auth" antes de arrancar GoTrue
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d esencial -c 'CREATE SCHEMA IF NOT EXISTS auth;'

      - name: Levantar GoTrue (crea auth.users al arrancar, ya con el schema listo)
        run: |
          docker run -d --name gotrue --network host \
            -e GOTRUE_API_HOST=0.0.0.0 \
            -e GOTRUE_API_PORT=9999 \
            -e API_EXTERNAL_URL=http://localhost:9999 \
            -e GOTRUE_DB_DRIVER=postgres \
            -e GOTRUE_DB_DATABASE_URL='postgres://postgres:postgres@localhost:5432/esencial?sslmode=disable' \
            -e GOTRUE_SITE_URL=http://localhost:3000 \
            -e GOTRUE_URI_ALLOW_LIST=http://localhost:3000 \
            -e GOTRUE_DISABLE_SIGNUP=false \
            -e GOTRUE_JWT_SECRET=ci-only-secret-not-for-production-min-32chars \
            -e GOTRUE_JWT_EXP=3600 \
            -e GOTRUE_JWT_AUD=authenticated \
            -e GOTRUE_JWT_DEFAULT_GROUP_NAME=authenticated \
            -e GOTRUE_JWT_ADMIN_ROLES=service_role \
            -e GOTRUE_EXTERNAL_EMAIL_ENABLED=true \
            -e GOTRUE_MAILER_AUTOCONFIRM=true \
            ghcr.io/supabase/gotrue:v2.158.1

      - name: Esperar a que GoTrue esté listo
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:9999/health && exit 0
            sleep 2
          done
          echo "GoTrue no respondió a tiempo — logs del contenedor:" >&2
          docker logs gotrue
          exit 1

      - name: Aplicar migraciones de Prisma contra Postgres de CI
        run: npm run prisma:migrate:deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/esencial

      - run: npm run typecheck
      - run: npm run build
